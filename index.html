<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد التوظيف الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">مساعد التوظيف الذكي</h1>
        <p class="text-center text-gray-500 mb-8">
            ارفع ملف السيرة الذاتية (PDF) + رابط لينكدإن للحصول على اقتراحات وظائف دقيقة
        </p>
        
        <div class="space-y-5">
            <!-- رابط لينكدإن -->
            <div>
                <label class="block text-sm font-semibold mb-2">
                    رابط ملف لينكدإن <span class="text-gray-400 font-normal">(اختياري)</span>
                </label>
                <input 
                    type="url" 
                    id="linkedinUrl" 
                    placeholder="https://www.linkedin.com/in/username" 
                    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <!-- رفع ملف PDF -->
            <div>
                <label class="block text-sm font-semibold mb-2">
                    رفع ملف السيرة الذاتية (PDF)
                    <span class="text-red-500">*</span>
                </label>
                <input 
                    type="file" 
                    id="pdfFile" 
                    accept=".pdf,application/pdf"
                    class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                >
                <p class="text-xs text-gray-400 mt-1">الحد الأقصى الموصى به: 10 ميجا</p>
            </div>

            <button 
                onclick="searchJobs()" 
                id="searchBtn" 
                class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition duration-200 shadow-md disabled:opacity-60 disabled:cursor-not-allowed"
            >
                ابحث عن الوظائف المناسبة
            </button>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-3 text-gray-600 font-medium">جاري قراءة ملف السيرة الذاتية وتحليلها...</p>
        </div>

        <div id="results" class="mt-8 space-y-4"></div>
    </div>

<script>
async function searchJobs() {
    const linkedinUrl = document.getElementById('linkedinUrl').value.trim();
    const fileInput = document.getElementById('pdfFile');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    const searchBtn = document.getElementById('searchBtn');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert('من فضلك اختر ملف السيرة الذاتية بصيغة PDF.');
        return;
    }

    const file = fileInput.files[0];

    if (file.type !== 'application/pdf') {
        alert('الملف يجب أن يكون بصيغة PDF فقط.');
        return;
    }

    // تحويل الملف إلى Base64
    const base64 = await fileToBase64(file);

    searchBtn.disabled = true;
    loadingDiv.classList.remove('hidden');
    resultsDiv.innerHTML = '';

    try {
        const response = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                linkedinUrl,
                pdfBase64: base64,
                fileName: file.name
            })
        });

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error('الخادم أرجع رداً غير متوقع: ' + text.substring(0, 120));
        }

        if (response.ok && data.result) {
            resultsDiv.innerHTML = `
                <div class="p-6 bg-blue-50 rounded-xl border border-blue-200 leading-relaxed">
                    ${data.result}
                </div>
            `;
        } else {
            resultsDiv.innerHTML = `
                <p class="text-red-500 text-center font-medium">
                    ${data.error || 'حدث خطأ أثناء معالجة الطلب.'}
                </p>
            `;
        }
    } catch (error) {
        resultsDiv.innerHTML = `
            <p class="text-red-500 text-center font-medium">
                حدث خطأ في الاتصال: ${error.message}
            </p>
        `;
    } finally {
        loadingDiv.classList.add('hidden');
        searchBtn.disabled = false;
    }
}

// دالة تحويل الملف إلى Base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            // نشيل الجزء "data:application/pdf;base64,"
            const base64 = reader.result.split(',')[1];
            resolve(base64);
        };
        reader.onerror = error => reject(error);
    });
}
</script>
</body>
</html>
