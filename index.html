<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البحث الذكي عن الوظائف</title>
    <!-- تضمين Tailwind CSS لتصميم سريع وعصري -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- رأس الصفحة -->
    <header class="bg-blue-600 text-white shadow-md py-6">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">منصة البحث عن الوظائف</h1>
            <p class="mt-2 text-blue-100">ابحث عن وظيفتك المستقبلية بسهولة وسرعة</p>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- قسم البحث -->
        <div class="bg-white p-6 rounded-xl shadow-sm max-w-2xl mx-auto mb-8 border border-gray-100">
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="ابحث عن المسمى الوظيفي، المهارة، أو الشركة..." 
                    class="flex-grow px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-right"
                >
                <button 
                    id="searchBtn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-all duration-200 shadow-md flex items-center justify-center gap-2"
                >
                    <span>بحث</span>
                </button>
            </div>
        </div>

        <!-- مؤشر التحميل (مخفي افتراضياً) -->
        <div id="loadingSpinner" class="hidden flex flex-col items-center justify-center my-12">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-4 text-gray-600 font-medium">جاري البحث عن أفضل الوظائف...</p>
        </div>

        <!-- نتائج البحث -->
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
            <!-- سيتم حقن البطاقات هنا ديناميكياً من خلال الجافاسكريبت -->
        </div>
    </main>

    <!-- ذيل الصفحة -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        <p>جميع الحقوق محفوظة © Jobs Auto Search</p>
    </footer>

    <!-- كود الجافاسكريبت للتفاعل -->
    <script>
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const resultsContainer = document.getElementById('resultsContainer');

        searchBtn.addEventListener('click', async () => {
            const query = searchInput.value.trim();
            if (!query) return;

            // إظهار مؤشر التحميل وتفريغ النتائج القديمة
            loadingSpinner.classList.remove('hidden');
            resultsContainer.innerHTML = '';

            try {
                // محاكاة الاتصال بملف الـ API (api/search.js)
                // const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                // const data = await response.json();

                // محاكاة وقت الاستجابة (يمكنك استبدالها بالاتصال الفعلي بالـ API لاحقاً)
                await new Promise(resolve => setTimeout(resolve, 1500));

                // بيانات تجريبية للعرض (تجريبية لحين ربط الـ API)
                const mockJobs = [
                    { title: 'مطور واجهات أمامية (Frontend Developer)', company: 'شركة التقنية المتقدمة', location: 'عن بعد', link: '#' },
                    { title: 'مهندس برمجيات (Software Engineer)', company: 'ابتكارات الويب', location: 'دبي، الإمارات', link: '#' }
                ];

                // إخفاء مؤشر التحميل
                loadingSpinner.classList.add('hidden');

                // عرض النتائج
                if (mockJobs.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-center text-gray-500 col-span-2">لم يتم العثور على وظائف مطابقة.</p>';
                    return;
                }

                mockJobs.forEach(job => {
                    const jobCard = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                            <h3 class="text-xl font-bold text-blue-600 mb-2">${job.title}</h3>
                            <p class="text-gray-700 font-medium mb-1">${job.company}</p>
                            <p class="text-gray-500 text-sm mb-4">${job.location}</p>
                            <a href="${job.link}" class="inline-block bg-gray-100 hover:bg-blue-600 hover:text-white text-gray-800 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                                عرض التفاصيل والتقديم
                            </a>
                        </div>
                    `;
                    resultsContainer.innerHTML += jobCard;
                });

            } catch (error) {
                loadingSpinner.classList.add('hidden');
                resultsContainer.innerHTML = '<p class="text-center text-red-500 col-span-2">حدث خطأ أثناء جلب النتائج. يرجى المحاولة مرة أخرى.</p>';
            }
        });
    </script>
</body>
</html>
