<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد التوظيف الذكي</title>
    
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        * { font-family: 'Cairo', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- ==================== شاشة تسجيل الدخول ==================== -->
    <div id="loginScreen" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;">
        <div style="background: white; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; border: 1px solid #f1f5f9;">
            
            <!-- الأيقونة -->
            <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            
            <h1 style="font-size: 24px; font-weight: 800; color: #1e293b; margin: 0 0 8px 0;">مساعد التوظيف الذكي</h1>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 32px 0;">سجل دخولك للبدء في البحث عن الوظائف المناسبة</p>

            <button 
                onclick="loginWithGoogle()" 
                id="googleBtn"
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: white; border: 2px solid #e2e8f0; color: #334155; font-weight: 600; padding: 14px 24px; border-radius: 16px; cursor: pointer; font-size: 15px; transition: all 0.2s;"
            >
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                تسجيل الدخول بواسطة جوجل
            </button>

            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 16px; display: none;"></p>
        </div>
    </div>

    <!-- ==================== الواجهة الرئيسية ==================== -->
    <div id="appScreen" style="display: none;">
        
        <!-- Header -->
        <header class="gradient-bg" style="color: white; padding: 24px 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            <div style="max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h1 style="font-size: 24px; font-weight: 800; margin: 0;">مساعد التوظيف الذكي</h1>
                    <p style="font-size: 13px; opacity: 0.9; margin: 4px 0 0 0;">احصل على وظائف مناسبة مع روابط التقديم</p>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img id="userPhoto" src="" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: none;" alt="User">
                    <div style="text-align: right;">
                        <p id="userName" style="font-size: 13px; font-weight: 600; margin: 0;"></p>
                        <button onclick="logout()" style="font-size: 12px; color: #c7d2fe; background: none; border: none; cursor: pointer; padding: 0;">تسجيل الخروج</button>
                    </div>
                </div>
            </div>
        </header>

        <main style="max-width: 900px; margin: 0 auto; padding: 32px 16px;">
            
            <!-- Form -->
            <div style="background: white; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); padding: 32px; margin-bottom: 32px; border: 1px solid #f1f5f9;">
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    
                    <div>
                        <label style="display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px;">
                            رابط لينكدإن <span style="color: #94a3b8; font-weight: 400;">(اختياري)</span>
                        </label>
                        <input 
                            type="url" 
                            id="linkedinUrl" 
                            placeholder="https://www.linkedin.com/in/username" 
                            style="width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 15px; outline: none; box-sizing: border-box;"
                        >
                    </div>

                    <div>
                        <label style="display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px;">
                            البحث باسم وظيفة معينة <span style="color: #94a3b8; font-weight: 400;">(اختياري)</span>
                        </label>
                        <input 
                            type="text" 
                            id="jobTitle" 
                            placeholder="مثال: مدير مالي، محاسب أول، مراجع داخلي..." 
                            style="width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 15px; outline: none; box-sizing: border-box;"
                        >
                    </div>

                    <div>
                        <label style="display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px;">
                            رفع ملف السيرة الذاتية (PDF) <span style="color: #ef4444;">*</span>
                        </label>
                        <input 
                            type="file" 
                            id="pdfFile" 
                            accept=".pdf,application/pdf"
                            style="width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 14px; box-sizing: border-box;"
                        >
                        <p style="font-size: 12px; color: #94a3b8; margin: 8px 0 0 0;">يفضل أن يكون الملف أقل من 5 ميجا</p>
                    </div>

                    <button 
                        onclick="searchJobs()" 
                        id="searchBtn" 
                        class="gradient-bg"
                        style="width: 100%; color: white; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 17px; border: none; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(102, 126, 234, 0.3);"
                    >
                        ابحث عن الوظائف المناسبة
                    </button>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" style="display: none; text-align: center; padding: 64px 0;">
                <div style="display: inline-block; width: 48px; height: 48px; border: 4px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <p id="loadingText" style="margin-top: 16px; color: #475569; font-weight: 500;">جاري قراءة ملف السيرة الذاتية...</p>
            </div>

            <style>
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            </style>

            <!-- Results -->
            <div id="results"></div>

            <div id="clearSection" style="display: none; margin-top: 24px; text-align: center;">
                <button onclick="clearResults()" style="font-size: 13px; color: #64748b; background: none; border: none; cursor: pointer; text-decoration: underline;">
                    مسح النتائج
                </button>
            </div>
        </main>

        <footer style="text-align: center; color: #94a3b8; font-size: 13px; padding: 32px 0;">
            مساعد التوظيف الذكي © 2026
        </footer>
    </div>

<script>
    // ====================== Firebase Config ======================
    const firebaseConfig = {
        apiKey: "AIzaSyCnsQtY9PdymuKG5suBX1psYgdkCHFFYKs",
        authDomain: "jobsautosearch.firebaseapp.com",
        projectId: "jobsautosearch",
        storageBucket: "jobsautosearch.firebasestorage.app",
        messagingSenderId: "810040080530",
        appId: "1:810040080530:web:468f87f88571a510980e4b",
        measurementId: "G-Z5NKFH9E7N"
    };

    try {
        firebase.initializeApp(firebaseConfig);
    } catch (e) {
        console.log('Firebase already initialized');
    }
    
    const auth = firebase.auth();

    // ====================== Auth Logic ======================
    auth.onAuthStateChanged((user) => {
        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.getElementById('appScreen');
        
        if (user) {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'block';
            
            document.getElementById('userName').textContent = user.displayName || user.email || 'مستخدم';
            
            if (user.photoURL) {
                const photo = document.getElementById('userPhoto');
                photo.src = user.photoURL;
                photo.style.display = 'block';
            }
        } else {
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        const btn = document.getElementById('googleBtn');
        const errorEl = document.getElementById('loginError');
        
        btn.disabled = true;
        btn.style.opacity = '0.6';
        errorEl.style.display = 'none';

        auth.signInWithPopup(provider)
            .then(() => {
                btn.disabled = false;
                btn.style.opacity = '1';
            })
            .catch((error) => {
                console.error(error);
                errorEl.textContent = 'حدث خطأ: ' + (error.message || 'فشل تسجيل الدخول');
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.style.opacity = '1';
            });
    }

    function logout() {
        auth.signOut().then(() => {
            localStorage.removeItem('jobResults');
        });
    }

    // ====================== App Logic ======================
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    window.addEventListener('DOMContentLoaded', () => {
        const savedResults = localStorage.getItem('jobResults');
        const savedLinkedin = localStorage.getItem('linkedinUrl');
        const savedJobTitle = localStorage.getItem('jobTitle');

        if (savedLinkedin) {
            const el = document.getElementById('linkedinUrl');
            if (el) el.value = savedLinkedin;
        }
        if (savedJobTitle) {
            const el = document.getElementById('jobTitle');
            if (el) el.value = savedJobTitle;
        }

        if (savedResults) {
            const resultsEl = document.getElementById('results');
            const clearEl = document.getElementById('clearSection');
            if (resultsEl) resultsEl.innerHTML = savedResults;
            if (clearEl) clearEl.style.display = 'block';
        }
    });

    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + '\n\n';
        }
        return fullText.trim();
    }

    async function searchJobs() {
        const linkedinUrl = document.getElementById('linkedinUrl').value.trim();
        const jobTitle = document.getElementById('jobTitle').value.trim();
        const fileInput = document.getElementById('pdfFile');
        const resultsDiv = document.getElementById('results');
        const loadingDiv = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const searchBtn = document.getElementById('searchBtn');
        const clearSection = document.getElementById('clearSection');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('من فضلك اختر ملف السيرة الذاتية بصيغة PDF.');
            return;
        }

        const file = fileInput.files[0];
        if (file.type !== 'application/pdf') {
            alert('الملف يجب أن يكون بصيغة PDF فقط.');
            return;
        }

        localStorage.setItem('linkedinUrl', linkedinUrl);
        localStorage.setItem('jobTitle', jobTitle);

        searchBtn.disabled = true;
        searchBtn.style.opacity = '0.6';
        loadingDiv.style.display = 'block';
        resultsDiv.innerHTML = '';
        clearSection.style.display = 'none';
        loadingText.textContent = 'جاري استخراج النص من ملف السيرة الذاتية...';

        try {
            const profileText = await extractTextFromPDF(file);

            if (!profileText || profileText.length < 50) {
                throw new Error('لم يتمكن النظام من قراءة نص كافٍ من الملف.');
            }

            loadingText.textContent = 'جاري تحليل السيرة الذاتية واقتراح الوظائف...';

            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ linkedinUrl, jobTitle, profileText })
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                throw new Error('الخادم أرجع رداً غير متوقع');
            }

            if (response.ok && data.result) {
                resultsDiv.innerHTML = data.result;
                localStorage.setItem('jobResults', data.result);
                clearSection.style.display = 'block';
            } else {
                resultsDiv.innerHTML = `
                    <div style="background:#fef2f2; color:#dc2626; padding:20px; border-radius:16px; text-align:center; font-weight:500; border:1px solid #fecaca;">
                        ${data.error || 'حدث خطأ أثناء معالجة الطلب.'}
                    </div>
                `;
            }
        } catch (error) {
            resultsDiv.innerHTML = `
                <div style="background:#fef2f2; color:#dc2626; padding:20px; border-radius:16px; text-align:center; font-weight:500; border:1px solid #fecaca;">
                    حدث خطأ: ${error.message}
                </div>
            `;
        } finally {
            loadingDiv.style.display = 'none';
            searchBtn.disabled = false;
            searchBtn.style.opacity = '1';
        }
    }

    function clearResults() {
        localStorage.removeItem('jobResults');
        document.getElementById('results').innerHTML = '';
        document.getElementById('clearSection').style.display = 'none';
    }
</script>
</body>
</html>
